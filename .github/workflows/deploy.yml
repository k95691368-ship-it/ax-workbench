# 수동 실행 전용 배포 워크플로 (Actions 탭 → Run workflow)
#
# 자동 배포(푸시 시)를 켜려면:
#   1. GitHub Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN 등록
#      (Cloudflare 대시보드 → My Profile → API Tokens → "Cloudflare Pages — Edit" 권한)
#   2. 아래 on: 에 push: { branches: [master] } 복원
# 토큰 미등록 상태로 push 트리거를 켜두면 푸시마다 실패 메일이 발송되므로 수동 전용으로 둔다.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c6e8801c6c9793a146a8d063f3a4013
          command: pages deploy dist --project-name=ax-workbench --branch=master

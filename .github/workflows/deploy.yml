# 수동 실행 전용 배포 워크플로 (Actions 탭 → Run workflow)
#
# 자동 배포(푸시 시)를 켜려면:
#   1. GitHub Settings → Secrets and variables → Actions 에 두 개를 등록
#      - CLOUDFLARE_API_TOKEN  (Cloudflare 대시보드 → My Profile → API Tokens →
#                               "Cloudflare Pages — Edit" 권한)
#      - CLOUDFLARE_ACCOUNT_ID (Cloudflare 대시보드 우측 또는 대시보드 URL의 계정 ID)
#   2. 아래 on: 에 push: { branches: [master] } 복원
# 토큰 미등록 상태로 push 트리거를 켜두면 푸시마다 실패 메일이 발송되므로 수동 전용으로 둔다.
#
# 계정 ID를 파일에 적지 않는 이유: 그 자체로는 자격증명이 아니지만(토큰 없이는 아무것도
# 못 한다), 공개 저장소에서는 표적을 특정해 주는 값이다. 토큰과 같은 자리에 두면
# "어디까지가 비밀인가"를 매번 판단하지 않아도 된다.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ax-workbench --branch=master
